<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dean's Knowledge Forest</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bark:#5C3218;--bark2:#7A4A28;--bark3:#3A1E0A;
  --cream:#F5F0E8;--warm:#EDE0CC;
  --text:#2C1A0E;--text2:#5C3D1E;--text3:#9C8B7A;
  --gold:#C9963A;
}
body{min-height:100vh;font-family:'Noto Serif TC','Lora',Georgia,serif;color:#fff;overflow-x:hidden;background:#1a1a1a}

/* ── BG Photo ── */
#bg{position:fixed;inset:0;z-index:0}
.bg-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s ease}
.bg-slide.active{opacity:1}
#bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.3) 35%,rgba(0,0,0,.55) 65%,rgba(0,0,0,.82) 100%)}

/* particles */
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.flake,.petal,.leaf-fall{position:absolute;top:-20px;animation:fall linear infinite;opacity:.85}
.flake{color:rgba(255,255,255,.8);font-size:16px}
.petal{width:9px;height:9px;background:#FFB7C5;border-radius:50% 0 50% 0}
.leaf-fall{font-size:18px}
@keyframes fall{to{transform:translateY(105vh) translateX(var(--dx,30px)) rotate(720deg);opacity:0}}

/* ── Layout ── */
#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}

/* header */
header{padding:18px 28px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{font-family:'Lora',serif;font-size:19px;font-weight:600;color:#fff;letter-spacing:.05em;display:flex;align-items:center;gap:8px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.logo i{color:var(--gold)}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 13px;font-size:12px;font-family:'Noto Serif TC',serif;color:#fff;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
.s-btn:hover,.s-btn.active{background:rgba(255,255,255,.38);border-color:rgba(255,255,255,.6);font-weight:600}
.btn-add{display:flex;align-items:center;gap:5px;background:var(--gold);color:#fff;border:none;border-radius:22px;padding:7px 16px;font-size:13px;font-family:'Noto Serif TC',serif;cursor:pointer;transition:background .2s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.btn-add:hover{background:#a87a28}

/* search */
.search-zone{padding:14px 28px 0;max-width:620px;width:100%;margin:0 auto}
.search-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);border-radius:28px;padding:10px 20px}
.search-bar i{color:rgba(255,255,255,.8);font-size:18px;flex-shrink:0}
.search-bar input{flex:1;border:none;background:transparent;font-family:'Noto Serif TC',serif;font-size:14px;color:#fff;outline:none}
.search-bar input::placeholder{color:rgba(255,255,255,.55);font-style:italic}
#clear-search{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:18px;display:none;padding:0}

/* cats */
.cat-zone{padding:12px 28px 0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;max-width:900px;width:100%;margin:0 auto}
.cat-zone::-webkit-scrollbar{display:none}
.cat-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 14px;font-size:13px;font-family:'Noto Serif TC',serif;color:#fff;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.cat-btn.active,.cat-btn:hover{background:rgba(255,255,255,.32);border-color:rgba(255,255,255,.55);font-weight:600}
.subcat-zone{padding:7px 28px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:900px;width:100%;margin:0 auto;min-height:34px}
.subcat-zone::-webkit-scrollbar{display:none}
.sub-btn{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:4px 12px;font-size:12px;font-family:'Noto Serif TC',serif;color:rgba(255,255,255,.75);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.sub-btn.active,.sub-btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);color:#fff}

.result-info{font-size:12px;color:rgba(255,255,255,.55);padding:6px 28px 0;max-width:960px;width:100%;margin:0 auto;font-style:italic}

/* ── Shelf ── */
.shelf-area{flex:1;padding:14px 24px 80px;max-width:1100px;width:100%;margin:0 auto}
.shelf-block{margin-bottom:32px}
.shelf-label{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.6);text-transform:uppercase;margin-bottom:10px;padding-left:4px;font-family:'Lora',serif;text-shadow:0 1px 4px rgba(0,0,0,.5)}

.shelf-rail{background:linear-gradient(180deg,#8B5E3C 0%,#6B4226 60%,#5C3218 100%);border-radius:8px 8px 0 0;padding:16px 18px 0;box-shadow:0 6px 0 #3A1E0A,0 8px 20px rgba(0,0,0,.5);position:relative;min-height:110px}
.shelf-rail::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:6px;background:#3A1E0A;border-radius:0 0 5px 5px}
/* wood grain */
.shelf-rail::before{content:'';position:absolute;inset:0;border-radius:8px 8px 0 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 28px);pointer-events:none}

.books-row{display:flex;align-items:flex-end;gap:6px;padding-bottom:14px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.books-row::-webkit-scrollbar{height:4px}
.books-row::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}

/* BOOK — bigger & readable */
.book{flex-shrink:0;border-radius:4px 2px 2px 4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s ease,box-shadow .2s;position:relative;border-right:4px solid rgba(0,0,0,.22);box-shadow:2px 0 6px rgba(0,0,0,.3)}
.book:hover{transform:translateY(-14px);box-shadow:4px 0 18px rgba(0,0,0,.45)}
.book-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:8px 4px}
.book-title{writing-mode:vertical-rl;font-size:12px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.95);text-align:center;line-height:1.35;font-family:'Noto Serif TC',serif;word-break:keep-all;text-shadow:0 1px 3px rgba(0,0,0,.4);overflow:hidden;max-height:100%}
/* book heights & widths — larger */
.bh-xl{height:130px;min-width:38px;max-width:52px}
.bh-lg{height:110px;min-width:34px;max-width:46px}
.bh-md{height:92px;min-width:30px;max-width:42px}
.bh-sm{height:76px;min-width:26px;max-width:38px}
/* top page stripe */
.book::before{content:'';position:absolute;top:3px;left:3px;right:8px;height:5px;background:rgba(255,255,255,.12);border-radius:1px}

/* book context menu */
.book-ctx{position:absolute;top:4px;right:6px;background:rgba(0,0,0,.55);border-radius:50%;width:18px;height:18px;display:none;align-items:center;justify-content:center;color:#fff;font-size:11px;z-index:5;backdrop-filter:blur(4px)}
.book:hover .book-ctx{display:flex}

/* deco */
.shelf-pot{display:flex;flex-direction:column;align-items:center;flex-shrink:0;margin:0 5px}
.spot{width:22px;height:16px;background:#7D5A50;border-radius:0 0 6px 6px;position:relative}
.spot::before{content:'';position:absolute;top:-4px;left:-3px;right:-3px;height:5px;background:#6D4C41;border-radius:2px}
.sleaves{display:flex;gap:2px;align-items:flex-end}
.sleaf{width:13px;height:22px;background:#66BB6A;border-radius:60% 40% 60% 40%}
.sleaf.a{transform:rotate(-25deg);transform-origin:bottom center}
.sleaf.b{width:16px;height:28px;background:#4CAF50}
.sleaf.c{transform:rotate(25deg);transform-origin:bottom center}
.shelf-lantern{width:16px;height:22px;background:var(--gold);border-radius:4px;flex-shrink:0;position:relative;margin:0 3px;box-shadow:0 0 8px rgba(201,150,58,.5)}
.shelf-lantern::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:6px;height:7px;background:var(--bark3);border-radius:1px}
.shelf-rock{width:30px;height:22px;background:#8D8070;border-radius:60% 60% 40% 40%;flex-shrink:0}

/* empty */
.empty-shelf{text-align:center;padding:40px;color:rgba(255,255,255,.5);font-size:14px;font-style:italic}
.empty-shelf i{font-size:36px;display:block;margin-bottom:10px;opacity:.5}

/* ── Detail Panel ── */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.panel-overlay.open{display:flex}
.panel{background:rgba(30,18,8,.92);border:1px solid rgba(255,255,255,.15);border-radius:18px;max-width:520px;width:100%;padding:28px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.5);max-height:85vh;overflow-y:auto;backdrop-filter:blur(16px)}
.panel h2{font-size:18px;font-family:'Lora',serif;color:#fff;margin-bottom:10px;line-height:1.45;padding-right:28px}
.panel-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.pmeta{font-size:11px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px 10px;color:rgba(255,255,255,.75)}
.panel-summary{font-size:14px;line-height:1.85;color:rgba(255,255,255,.8);margin-bottom:16px}
.panel-tags{display:flex;gap:6px;flex-wrap:wrap}
.ptag{font-size:11px;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:2px 9px;color:rgba(255,255,255,.6)}
.panel-url{display:block;margin-top:14px;font-size:13px;color:var(--gold);word-break:break-all}
.panel-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.12);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
.panel-close:hover{background:rgba(255,255,255,.25)}
.panel-actions{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.pa-btn{flex:1;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:10px;padding:8px;font-size:12px;font-family:'Noto Serif TC',serif;color:#fff;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.pa-btn:hover{background:rgba(255,255,255,.18)}
.pa-btn.danger{border-color:rgba(220,80,80,.4)}
.pa-btn.danger:hover{background:rgba(220,80,80,.25)}

/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex}
.modal{background:rgba(28,16,6,.94);border:1px solid rgba(255,255,255,.15);border-radius:18px;max-width:480px;width:100%;padding:28px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-family:'Lora',serif;color:#fff;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal h2 i{color:var(--gold)}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:11px;color:rgba(255,255,255,.5);margin-bottom:5px;letter-spacing:.07em}
.form-group input,.form-group textarea,.form-group select{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:9px 12px;font-size:14px;font-family:'Noto Serif TC',serif;color:#fff;background:rgba(255,255,255,.08);outline:none;transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:rgba(201,150,58,.6)}
.form-group select option{background:#2a1a08;color:#fff}
.form-group textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-save{background:var(--gold);color:#fff;border:none;border-radius:22px;padding:10px 28px;font-size:14px;font-family:'Noto Serif TC',serif;cursor:pointer;width:100%;margin-top:6px;transition:background .2s;font-weight:600}
.btn-save:hover{background:#a87a28}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
.modal-close:hover{background:rgba(255,255,255,.2)}

/* rename modal */
#rename-modal .modal{max-width:380px}

/* delete confirm */
.del-confirm{background:rgba(28,16,6,.96);border:1px solid rgba(220,80,80,.3);border-radius:16px;max-width:340px;width:100%;padding:24px;text-align:center}
.del-confirm h3{font-size:16px;color:#fff;margin-bottom:10px;font-family:'Lora',serif}
.del-confirm p{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:20px;line-height:1.6}
.del-btns{display:flex;gap:10px}
.del-btns button{flex:1;border-radius:10px;padding:9px;font-size:13px;font-family:'Noto Serif TC',serif;cursor:pointer;border:1px solid rgba(255,255,255,.15);color:#fff;background:rgba(255,255,255,.08);transition:all .2s}
.del-btns .danger-btn{background:rgba(200,50,50,.3);border-color:rgba(200,50,50,.5)}
.del-btns .danger-btn:hover{background:rgba(200,50,50,.55)}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,18,6,.95);border:1px solid rgba(201,150,58,.3);color:#fff;border-radius:24px;padding:10px 24px;font-size:13px;font-family:'Noto Serif TC',serif;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(8px)}
.toast.show{opacity:1}

/* bookmarklet hint */
.bm-banner{position:fixed;bottom:20px;right:20px;background:rgba(30,18,8,.88);backdrop-filter:blur(10px);border:1px solid rgba(201,150,58,.25);border-radius:12px;padding:12px 16px 12px;font-size:12px;color:rgba(255,255,255,.8);max-width:230px;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.bm-banner strong{display:block;margin-bottom:5px;color:var(--gold)}
.bm-link{display:inline-block;margin-top:7px;padding:5px 14px;background:var(--gold);color:#fff;border-radius:12px;font-size:11px;cursor:pointer;text-decoration:none;font-weight:600}
.bm-close{position:absolute;top:7px;right:10px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);font-size:13px}

/* photo credit */
.photo-credit{position:fixed;bottom:8px;left:12px;font-size:10px;color:rgba(255,255,255,.3);z-index:3;pointer-events:none}
/* ── Inbox / 暫存區 ── */
.inbox-fab{position:fixed;bottom:28px;left:28px;z-index:60;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.inbox-btn{display:flex;align-items:center;gap:7px;background:rgba(30,18,8,.88);backdrop-filter:blur(10px);border:1px solid rgba(201,150,58,.35);border-radius:24px;padding:9px 18px;font-size:13px;font-family:'Noto Serif TC',serif;color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:all .2s}
.inbox-btn:hover{background:rgba(50,30,10,.95);border-color:var(--gold)}
.inbox-badge{background:var(--gold);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.inbox-badge:empty,.inbox-badge.hide{display:none}

/* Inbox drawer */
.inbox-drawer{position:fixed;bottom:0;left:0;right:0;z-index:150;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.inbox-drawer.open{transform:translateY(0)}
.inbox-inner{background:rgba(22,12,4,.96);backdrop-filter:blur(18px);border-top:1px solid rgba(201,150,58,.2);border-radius:20px 20px 0 0;padding:20px 24px 32px;max-height:75vh;display:flex;flex-direction:column}
.inbox-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-shrink:0}
.inbox-header h3{font-size:16px;font-family:'Lora',serif;color:#fff;display:flex;align-items:center;gap:8px}
.inbox-header h3 i{color:var(--gold)}
.inbox-close-btn{background:rgba(255,255,255,.1);border:none;border-radius:50%;width:30px;height:30px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.inbox-close-btn:hover{background:rgba(255,255,255,.2)}

.inbox-items{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.inbox-items::-webkit-scrollbar{width:4px}
.inbox-items::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.inbox-empty{text-align:center;padding:40px;color:rgba(255,255,255,.35);font-size:14px;font-style:italic}
.inbox-empty i{font-size:32px;display:block;margin-bottom:8px;opacity:.4}

.inbox-item{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.inbox-item-info{flex:1;min-width:0}
.inbox-item-title{font-size:14px;color:#fff;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-item-url{font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-item-date{font-size:10px;color:rgba(255,255,255,.3);margin-top:3px}
.inbox-item-actions{display:flex;gap:6px;flex-shrink:0;margin-top:2px}
.ia-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 10px;font-size:11px;font-family:'Noto Serif TC',serif;color:#fff;cursor:pointer;transition:all .2s;white-space:nowrap}
.ia-btn:hover{background:rgba(255,255,255,.2)}
.ia-btn.file{background:rgba(201,150,58,.2);border-color:rgba(201,150,58,.4)}
.ia-btn.file:hover{background:rgba(201,150,58,.4)}
.ia-btn.del{border-color:rgba(220,80,80,.3)}
.ia-btn.del:hover{background:rgba(220,80,80,.25)}

/* file-to-shelf modal */
.file-modal-inner{max-width:420px}

</style>
</head>
<body>

<div id="bg"><div id="bg-overlay"></div></div>
<div id="particles"></div>

<div id="app">
  <header>
    <div class="logo"><i class="ti ti-trees" aria-hidden="true"></i>Dean's Knowledge Forest</div>
    <div class="top-right">
      <button class="s-btn" data-s="spring">🌸 春</button>
      <button class="s-btn" data-s="summer">🌿 夏</button>
      <button class="s-btn" data-s="autumn">🍂 秋</button>
      <button class="s-btn" data-s="winter">❄️ 冬</button>
      <button class="btn-add" onclick="openAdd()"><i class="ti ti-plus"></i>新增</button>
    </div>
  </header>

  <div class="search-zone">
    <div class="search-bar">
      <i class="ti ti-search"></i>
      <input type="text" id="search-input" placeholder="在書林中搜尋知識…" oninput="handleSearch(this.value)">
      <button id="clear-search" onclick="clearSearch()"><i class="ti ti-x"></i></button>
    </div>
  </div>

  <div class="cat-zone" id="cat-zone"></div>
  <div class="subcat-zone" id="subcat-zone"></div>
  <div class="result-info" id="result-info"></div>
  <div class="shelf-area" id="shelf-area"></div>
</div>

<!-- Detail Page (full screen overlay) -->
<div id="detail-page" style="display:none;position:fixed;inset:0;z-index:90;overflow-y:auto;background:rgba(10,6,2,.96);backdrop-filter:blur(20px)">
  <div style="max-width:900px;margin:0 auto;padding:24px 24px 60px">
    <button onclick="closeDetail()" style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:7px 16px;color:#fff;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:24px">
      <i class="ti ti-arrow-left" style="font-size:15px"></i>回書架
    </button>

    <!-- header -->
    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span id="dp-typebadge" style="display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 11px;border-radius:8px;font-weight:600"></span>

/* ── Slideshow — one photo per hour or per session ── */
function getHourlyPhotoIndex(season){
  const photos=SEASON_PHOTOS[season];
  const hr=new Date().getHours(); // 0-23, changes every hour
  return hr % photos.length;
}

function initSlides(season){
  const bg=document.getElementById('bg');
  bg.querySelectorAll('.bg-slide').forEach(el=>el.remove());
  slides=[];slideIndex=0;
  const photos=SEASON_PHOTOS[season];
  const idx=getHourlyPhotoIndex(season);
  // Preload current + next for smooth transition
  [idx,(idx+1)%photos.length].forEach((pi,i)=>{
    const div=document.createElement('div');
    div.className='bg-slide'+(i===0?' active':'');
    div.style.backgroundImage=`url(${photos[pi]})`;
    bg.appendChild(div);
    slides.push(div);
  });
  // Schedule next change at the top of next hour
  clearTimeout(slideTimer);
  const now=new Date();
  const msToNextHour=(60-now.getMinutes())*60000-(now.getSeconds()*1000);
  slideTimer=setTimeout(()=>initSlides(season),msToNextHour);
}

function spawnParticles(season){
  const p=document.getElementById('particles');
  p.innerHTML='';
  const cfg=PARTICLES[season];
  if(!cfg.type) return;
  for(let i=0;i<cfg.count;i++){
    const el=document.createElement('div');
    const dx=((Math.random()-.5)*80)+'px';
    el.style.setProperty('--dx',dx);
    el.style.left=Math.random()*100+'%';
    el.style.animationDuration=(5+Math.random()*7)+'s';
    el.style.animationDelay=(Math.random()*8)+'s';
    if(cfg.type==='snow'){el.className='flake';el.textContent='❄';}
    else if(cfg.type==='petal'){el.className='petal';}
    else{el.className='leaf-fall';el.textContent=['🍂','🍁'][Math.round(Math.random())];}
    p.appendChild(el);
  }
}

function applySeason(s){
  state.season=s;
  initSlides(s);
  spawnParticles(s);
  document.querySelectorAll('.s-btn').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
}

function autoSeason(){
  const m=new Date().getMonth();
  if(m>=2&&m<=4) return 'spring';
  if(m>=5&&m<=7) return 'summer';
  if(m>=8&&m<=10) return 'autumn';
  return 'winter';
}

/* ── Render ── */
function renderCats(){
  const z=document.getElementById('cat-zone');
  z.innerHTML='';
  const all=document.createElement('button');
  all.className='cat-btn'+(state.cat===''?' active':'');
  all.innerHTML='<i class="ti ti-layout-grid"></i>全部';
  all.onclick=()=>selectCat('');
  z.appendChild(all);
  db.categories.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='cat-btn'+(state.cat===c.id?' active':'');
    btn.innerHTML=`<i class="ti ${c.icon}" style="color:${c.color}"></i>${c.label}`;
    btn.onclick=()=>selectCat(c.id);
    z.appendChild(btn);
  });
}

function renderSubcats(){
  const z=document.getElementById('subcat-zone');
  z.innerHTML='';
  if(!state.cat) return;
  const cat=db.categories.find(c=>c.id===state.cat);
  if(!cat) return;
  const all=document.createElement('button');
  all.className='sub-btn'+(state.sub===''?' active':'');
  all.textContent='全部';all.onclick=()=>selectSub('');z.appendChild(all);
  cat.sub.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='sub-btn'+(state.sub===s?' active':'');
    btn.textContent=s;btn.onclick=()=>selectSub(s);z.appendChild(btn);
  });
}

function selectCat(id){state.cat=id;state.sub='';renderCats();renderSubcats();renderShelves();}
function selectSub(s){state.sub=s;renderSubcats();renderShelves();}

function filtered(){
  let e=db.entries;
  if(state.cat) e=e.filter(x=>x.category===state.cat);
  if(state.sub) e=e.filter(x=>x.sub===state.sub);
  if(state.q){
    const q=state.q.toLowerCase();
    e=e.filter(x=>x.title.toLowerCase().includes(q)||x.summary.toLowerCase().includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q)));
  }
  return e;
}

function renderShelves(){
  const area=document.getElementById('shelf-area');
  const info=document.getElementById('result-info');
  const entries=filtered();
  info.textContent=entries.length?`找到 ${entries.length} 筆知識`:'';
  if(!entries.length){
    area.innerHTML='<div class="empty-shelf"><i class="ti ti-books"></i>這片書架還是空的，去新增第一本書吧！</div>';
    return;
  }
  // group
  const groups={};
  entries.forEach(e=>{
    const key=e.category+'__'+(e.sub||'');
    if(!groups[key]) groups[key]={cat:e.category,sub:e.sub,entries:[]};
    groups[key].entries.push(e);
  });
  area.innerHTML='';
  Object.values(groups).forEach(g=>{
    const catObj=db.categories.find(c=>c.id===g.cat);
    const label=(catObj?catObj.label:'')+(g.sub?' · '+g.sub:'');
    const block=document.createElement('div');
    block.className='shelf-block';
    block.innerHTML=`<div class="shelf-label">${label}</div>`;
    const rail=document.createElement('div');rail.className='shelf-rail';
    const row=document.createElement('div');row.className='books-row';
    const seed=(g.cat+(g.sub||'')).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    g.entries.forEach((entry,i)=>{
      const bk=document.createElement('div');
      const heights=['bh-xl','bh-lg','bh-md','bh-sm'];
      const hClass=heights[(entry.title.length+i)%4];
      bk.className=`book ${hClass}`;
      const col=BOOK_COLORS[(seed+i)%BOOK_COLORS.length];
      bk.style.background=`linear-gradient(160deg, ${col}ee, ${col}bb)`;
      bk.innerHTML=`<div class="book-inner"><div class="book-title">${entry.title}</div></div><div class="book-ctx" title="選項" onclick="bookCtxClick(event,'${entry.id}')"><i class="ti ti-dots-vertical"></i></div>`;
      bk.onclick=(ev)=>{if(!ev.target.closest('.book-ctx')) openPanel(entry);};
      row.appendChild(bk);
      if((i+1)%6===0) row.appendChild(makeShelfDeco(i));
    });
    row.appendChild(makeShelfDeco(99));
    rail.appendChild(row);block.appendChild(rail);area.appendChild(block);
  });
}

function bookCtxClick(ev,id){
  ev.stopPropagation();
  const entry=db.entries.find(e=>e.id===id);
  if(entry) openPanel(entry);
}

function makeShelfDeco(i){
  const t=i%3;
  if(t===0){const d=document.createElement('div');d.className='shelf-pot';d.innerHTML='<div class="sleaves"><div class="sleaf a"></div><div class="sleaf b"></div><div class="sleaf c"></div></div><div class="spot"></div>';return d;}
  if(t===1){const d=document.createElement('div');d.className='shelf-lantern';return d;}
  const d=document.createElement('div');d.className='shelf-rock';return d;
}

/* ── Detail Page ── */
const FILE_TYPE_MAP={pdf:{label:'PDF',icon:'ti-file-type-pdf',color:'#E24B4A',bg:'rgba(226,75,74,.15)'},
  pptx:{label:'PPT',icon:'ti-file-type-ppt',color:'#EF9F27',bg:'rgba(239,159,39,.15)'},
  docx:{label:'Word',icon:'ti-file-type-doc',color:'#64B5F6',bg:'rgba(100,181,246,.15)'},
  web:{label:'網頁',icon:'ti-world',color:'#4CAF50',bg:'rgba(76,175,80,.15)'},
  default:{label:'文件',icon:'ti-file',color:'rgba(255,255,255,.5)',bg:'rgba(255,255,255,.08)'}};

function getFileType(entry){
  if(entry.url&&!entry.url.startsWith('http')) return 'default';
  if(entry.url) return 'web';
  if(entry.fileType) return entry.fileType;
  return 'default';
}

const CLAUDE_DEMO={
  summary:'已重新分析完成。文件核心論點：透過系統化四大支柱架構將品質管理從被動應對轉為主動預防，關鍵成功因素是 KPI 即時可視化與 90 天可量化里程碑。',
  actions:'行動清單已提取：\n① 本週完成 29 家供應商 Baseline KPI 收集\n② 下週啟動首批 QPA 稽核（優先紅燈供應商）\n③ 月底前完成 DFX Checklist 模板\n④ 下季 SRB 加入 Tier 2 Health Dashboard 議程',
  classify:'建議分類：\n主分類：工作 → 品質管理 ✓（現有分類正確）\n建議同時加入標籤：#執行計畫 #SLT #Zebra'
};

function openPanel(entry){
  currentEntryId=entry.id;
  const cat=db.categories.find(c=>c.id===entry.category);
  const ft=FILE_TYPE_MAP[getFileType(entry)];

  // type badge
  const tb=document.getElementById('dp-typebadge');
  tb.innerHTML=`<i class="ti ${ft.icon}" style="font-size:12px"></i>${ft.label}`;
  tb.style.cssText=`display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 11px;border-radius:8px;font-weight:600;background:${ft.bg};color:${ft.color}`;
  document.getElementById('dp-catbadge').textContent=(cat?cat.label:'')+(entry.sub?' · '+entry.sub:'');
  document.getElementById('dp-title').textContent=entry.title;
  document.getElementById('dp-meta').innerHTML=
    `<span style="display:flex;align-items:center;gap:4px"><i class="ti ti-calendar" style="font-size:12px"></i>${entry.date||''}</span>`+
    (entry.url?`<span style="display:flex;align-items:center;gap:4px"><i class="ti ti-link" style="font-size:12px"></i>有連結</span>`:'');
  document.getElementById('dp-summary').textContent=entry.summary||'（尚無摘要，點右側 Claude 自動產生）';

  // key points - split summary into bullets if no points stored
  const pts=entry.points||(entry.summary?[entry.summary]:[]);
  document.getElementById('dp-points').innerHTML=pts.slice(0,4).map(p=>
    `<div style="display:flex;gap:8px;font-size:13px;color:rgba(255,255,255,.7);line-height:1.6"><div style="width:6px;height:6px;border-radius:50%;background:#639922;flex-shrink:0;margin-top:7px"></div>${p}</div>`
  ).join('');
  document.getElementById('dp-tags').innerHTML=(entry.tags||[]).map(t=>
    `<span style="font-size:11px;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:2px 9px;color:rgba(255,255,255,.5)">#${t}</span>`
  ).join('');

  // file preview
  document.getElementById('dp-previcon').className=`ti ${ft.icon}`;
  document.getElementById('dp-previcon').style.color=ft.color;
  document.getElementById('dp-prevname').textContent=entry.url||entry.filename||entry.title;

  // notes
  document.getElementById('dp-noteinput').value=entry.note||'';
  document.getElementById('dp-clauderesult').style.display='none';
  document.getElementById('dp-thinking').style.display='none';
  dpTab('summary');

  document.getElementById('detail-page').style.display='block';
  window.scrollTo(0,0);
  document.getElementById('app').style.display='none';
}

function closeDetail(){
  document.getElementById('detail-page').style.display='none';
  document.getElementById('app').style.display='flex';
}

function dpTab(tab){
  document.getElementById('dp-tab-summary').style.display=tab==='summary'?'block':'none';
  document.getElementById('dp-tab-notes').style.display=tab==='notes'?'block':'none';
  document.getElementById('tab-sum-btn').style.cssText='padding:8px 18px;font-size:13px;font-family:inherit;color:'+(tab==='summary'?'#fff;border-bottom:2px solid var(--gold);font-weight:600':'rgba(255,255,255,.45);border-bottom:2px solid transparent')+';background:none;border-top:none;border-left:none;border-right:none;cursor:pointer';
  document.getElementById('tab-note-btn').style.cssText='padding:8px 18px;font-size:13px;font-family:inherit;color:'+(tab==='notes'?'#fff;border-bottom:2px solid var(--gold);font-weight:600':'rgba(255,255,255,.45);border-bottom:2px solid transparent')+';background:none;border-top:none;border-left:none;border-right:none;cursor:pointer';
}

function saveNote(){
  const e=db.entries.find(x=>x.id===currentEntryId);if(!e) return;
  e.note=document.getElementById('dp-noteinput').value;
  saveDB();showToast('筆記已儲存');
}

function dpOpenPreview(){
  const e=db.entries.find(x=>x.id===currentEntryId);if(!e) return;
  if(e.url) window.open(e.url,'_blank');
  else showToast('尚未設定連結');
}

function dpClaude(action){
  if(action==='qa'){
    const e=db.entries.find(x=>x.id===currentEntryId);
    closeDetail();
    showToast('請在下方 Claude 對話提問');
    return;
  }
  const thinking=document.getElementById('dp-thinking');
  const result=document.getElementById('dp-clauderesult');
  result.style.display='none';
  thinking.style.display='flex';
  setTimeout(()=>{
    thinking.style.display='none';
    result.innerHTML=(CLAUDE_DEMO[action]||'分析完成').replace(/\n/g,'<br>');
    result.style.display='block';
  },1600);
}

function closePanel(){closeDetail();}

/* ── Rename ── */
function openRename(){
  const e=db.entries.find(x=>x.id===currentEntryId);if(!e) return;
  document.getElementById('r-title').value=e.title;
  document.getElementById('r-summary').value=e.summary||'';
  document.getElementById('r-tags').value=(e.tags||[]).join(', ');
  document.getElementById('rename-modal').classList.add('open');
}
function closeRename(){document.getElementById('rename-modal').classList.remove('open');}
function closeRenameOvl(ev){if(ev.target===document.getElementById('rename-modal')) closeRename();}
function applyRename(){
  const e=db.entries.find(x=>x.id===currentEntryId);if(!e) return;
  const t=document.getElementById('r-title').value.trim();
  if(!t){showToast('標題不能為空');return;}
  e.title=t;
  e.summary=document.getElementById('r-summary').value.trim();
  e.tags=document.getElementById('r-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  saveDB();closeRename();
  // refresh panel title
  document.getElementById('p-title').textContent=e.title;
  document.getElementById('p-summary').textContent=e.summary||'（暫無摘要）';
  document.getElementById('p-tags').innerHTML=(e.tags||[]).map(t=>`<span class="ptag">#${t}</span>`).join('');
  renderShelves();showToast('✅ 已更新！');
}

/* ── Delete ── */
function confirmDelete(){
  const e=db.entries.find(x=>x.id===currentEntryId);if(!e) return;
  document.getElementById('del-text').textContent=`確定要從書架移除「${e.title}」嗎？此操作無法復原。`;
  document.getElementById('del-modal').classList.add('open');
}
function closeDelModal(){document.getElementById('del-modal').classList.remove('open');}
function closeDelOvl(ev){if(ev.target===document.getElementById('del-modal')) closeDelModal();}
function doDelete(){
  db.entries=db.entries.filter(x=>x.id!==currentEntryId);
  saveDB();closeDelModal();closePanel();renderShelves();showToast('🗑 已從書架移除');
}

/* ── Search ── */
function handleSearch(v){state.q=v;document.getElementById('clear-search').style.display=v?'block':'none';renderShelves();}
function clearSearch(){document.getElementById('search-input').value='';state.q='';document.getElementById('clear-search').style.display='none';renderShelves();}

/* ── Add ── */
function openAdd(){
  const sel=document.getElementById('f-cat');
  sel.innerHTML='<option value="">選擇分類…</option>';
  db.categories.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.label;sel.appendChild(o);});
  ['f-title','f-url','f-summary','f-tags'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-sub').innerHTML='<option value="">先選大分類</option>';
  document.getElementById('add-modal').classList.add('open');
}
function closeAdd(){document.getElementById('add-modal').classList.remove('open');}
function closeAddOvl(ev){if(ev.target===document.getElementById('add-modal')) closeAdd();}
function updateSubSelect(){
  const catId=document.getElementById('f-cat').value;
  const sub=document.getElementById('f-sub');
  sub.innerHTML='';
  const cat=db.categories.find(c=>c.id===catId);
  if(!cat){sub.innerHTML='<option value="">先選大分類</option>';return;}
  cat.sub.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sub.appendChild(o);});
}
function saveEntry(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){showToast('請填入標題');return;}
  const entry={
    id:'e'+Date.now(),title,
    url:document.getElementById('f-url').value.trim(),
    summary:document.getElementById('f-summary').value.trim(),
    category:document.getElementById('f-cat').value||'work',
    sub:document.getElementById('f-sub').value,
    tags:document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    date:new Date().toISOString().slice(0,10)
  };
  db.entries.unshift(entry);saveDB();closeAdd();renderShelves();showToast('📚 已存入書架！');
}

/* ── Toast ── */
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

/* ── Bookmarklet ── */
function buildBookmarklet(){
  const base=window.location.href.split('?')[0].replace(/index\.html$/,'');
  const code=`javascript:(function(){var t=document.title,u=window.location.href;window.open('${base}index.html?bm=1&title='+encodeURIComponent(t)+'&url='+encodeURIComponent(u),'_blank','width=520,height=640');}())`;
  const a=document.getElementById('bm-link');
  a.href=code;a.setAttribute('draggable','true');
}
function handleBookmarklet(){
  const p=new URLSearchParams(window.location.search);
  if(p.get('bm')==='1'){
    openAdd();
    setTimeout(()=>{
      document.getElementById('f-title').value=decodeURIComponent(p.get('title')||'');
      document.getElementById('f-url').value=decodeURIComponent(p.get('url')||'');
    },150);
    window.history.replaceState({},'',window.location.pathname);
  }
}


/* ── Inbox (暫存區) ── */
const INBOX_KEY='dean_inbox_v1';
let inbox=[];
let fileTargetId=null;

function loadInbox(){
  inbox=JSON.parse(localStorage.getItem(INBOX_KEY)||'[]');
  updateInboxBadge();
}
function saveInbox(){localStorage.setItem(INBOX_KEY,JSON.stringify(inbox));}
function updateInboxBadge(){
  const badge=document.getElementById('inbox-badge');
  const n=inbox.length;
  badge.textContent=n;
  badge.classList.toggle('hide',n===0);
  document.getElementById('inbox-count').textContent=n?`（${n} 篇待整理）`:'';
}

function toggleInbox(){
  const d=document.getElementById('inbox-drawer');
  const open=d.classList.toggle('open');
  if(open) renderInbox();
}
function closeInboxDrawer(){document.getElementById('inbox-drawer').classList.remove('open');}

function renderInbox(){
  const el=document.getElementById('inbox-items');
  if(!inbox.length){
    el.innerHTML='<div class="inbox-empty"><i class="ti ti-bookmark-off"></i>暫存區是空的<br>在任何網頁點 Bookmarklet 就能存進來</div>';
    return;
  }
  el.innerHTML='';
  inbox.forEach(item=>{
    const div=document.createElement('div');
    div.className='inbox-item';
    const d=item.date?new Date(item.date).toLocaleDateString('zh-TW'):'';
    div.innerHTML=`
      <div class="inbox-item-info">
        <div class="inbox-item-title" title="${item.title}">${item.title}</div>
        ${item.url?`<div class="inbox-item-url">${item.url}</div>`:''}
        <div class="inbox-item-date">${d}</div>
      </div>
      <div class="inbox-item-actions">
        ${item.url?`<a class="ia-btn" href="${item.url}" target="_blank" title="開啟原文"><i class="ti ti-external-link"></i></a>`:''}
        <button class="ia-btn file" onclick="openFileModal('${item.id}')"><i class="ti ti-books"></i> 歸入</button>
        <button class="ia-btn del" onclick="deleteInboxItem('${item.id}')"><i class="ti ti-trash"></i></button>
      </div>`;
    el.appendChild(div);
  });
}

function deleteInboxItem(id){
  inbox=inbox.filter(x=>x.id!==id);
  saveInbox();updateInboxBadge();renderInbox();
}

/* file-to-shelf */
function openFileModal(id){
  fileTargetId=id;

  document.getElementById('file-item-title').textContent='「'+item.title+'」';
  document.getElementById('file-summary').value=item.summary||'';
  document.getElementById('file-tags').value='';
  const sel=document.getElementById('file-cat');
  sel.innerHTML='<option value="">選擇分類…</option>';
  db.categories.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.label;sel.appendChild(o);});
  document.getElementById('file-sub').innerHTML='<option value="">先選大分類</option>';
  document.getElementById('file-modal').classList.add('open');
}
function closeFile(){document.getElementById('file-modal').classList.remove('open');}
function closeFileOvl(ev){if(ev.target===document.getElementById('file-modal')) closeFile();}
function updateFileSubSelect(){
  const catId=document.getElementById('file-cat').value;
  const sub=document.getElementById('file-sub');
  sub.innerHTML='';
  const cat=db.categories.find(c=>c.id===catId);
  if(!cat){sub.innerHTML='<option value="">先選大分類</option>';return;}
  cat.sub.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sub.appendChild(o);});
}
function doFileEntry(){
  const item=inbox.find(x=>x.id===fileTargetId);if(!item) return;
  const cat=document.getElementById('file-cat').value;
  if(!cat){showToast('請選擇分類');return;}
  const entry={
    id:'e'+Date.now(),
    title:item.title,
    url:item.url||'',
    summary:document.getElementById('file-summary').value.trim()||item.summary||'',
    category:cat,
    sub:document.getElementById('file-sub').value,
    tags:document.getElementById('file-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    date:new Date().toISOString().slice(0,10)
  };
  db.entries.unshift(entry);saveDB();
  inbox=inbox.filter(x=>x.id!==fileTargetId);saveInbox();
  updateInboxBadge();closeFile();renderInbox();renderShelves();
  showToast('📚 已從暫存區歸入書架！');
}

/* receive from bookmarklet into INBOX (not shelf directly) */
function handleBookmarklet(){
  const p=new URLSearchParams(window.location.search);
  if(p.get('bm')==='1'){
    const title=decodeURIComponent(p.get('title')||'');
    const url=decodeURIComponent(p.get('url')||'');
    // add to inbox instead of opening add modal
    const item={id:'bm'+Date.now(),title,url,summary:'',date:new Date().toISOString()};
    inbox.unshift(item);saveInbox();updateInboxBadge();
    window.history.replaceState({},'',window.location.pathname);
    showToast('📥 已加入暫存區！記得回來整理');
    // open inbox drawer so user sees it
    setTimeout(()=>{
      document.getElementById('inbox-drawer').classList.add('open');
      renderInbox();
    },400);
  }
}

/* ── Init ── */
loadDB();loadInbox();
const s=autoSeason();
applySeason(s);
document.querySelectorAll('.s-btn').forEach(b=>b.onclick=()=>applySeason(b.dataset.s));
renderCats();renderSubcats();renderShelves();
buildBookmarklet();handleBookmarklet();
