name: Fetch Stock Data

on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance
      - run: cd stock-dashboard && python3 fetch.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto update stock data'
          file_pattern: 'stock-dashboard/data.json'
