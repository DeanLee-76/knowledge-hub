<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Stock Dashboard · Dean</title>
<style>
:root{--bg:#F0F2F5;--surface:#fff;--surface2:#F7F8FA;--border:#DDE1E9;--text:#1A1D23;--muted:#7A8299;--up:#1A8A4A;--up-bg:#E6F5ED;--down:#C0392B;--down-bg:#FDECEA;--accent:#2563EB;--accent-bg:#EFF4FF;--tw:#C0392B;--us:#2563EB;--r:10px;--sh:0 1px 4px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;font-weight:700}.header .sub{font-size:.78rem;color:var(--muted);margin-top:3px}
.info{background:var(--accent-bg);border:1px solid #BFCFEE;border-radius:var(--r);padding:12px 16px;margin-bottom:18px;font-size:.8rem;color:#374571;line-height:1.7}
.info code{background:#fff;border:1px solid #BFCFEE;border-radius:4px;padding:1px 6px;font-family:monospace}
.status{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.live{background:var(--up)}.dot.warn{background:#F59E0B}.dot.error{background:var(--down)}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:9px 18px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab.active[data-m=TW]{color:var(--tw);border-bottom-color:var(--tw)}.tab.active[data-m=US]{color:var(--us);border-bottom-color:var(--us)}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:.68rem;font-weight:700;line-height:18px;text-align:center;margin-left:6px;background:var(--surface2);color:var(--muted)}
.tab.active .badge{background:var(--border);color:var(--text)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh)}
.card .lbl{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.card .val{font-size:1.5rem;font-weight:700}.val.up{color:var(--up)}.val.dn{color:var(--down)}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surface2);padding:9px 14px;font-size:.72rem;font-weight:700;color:var(--muted);text-align:right;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
thead th:first-child{text-align:left}thead th:hover{color:var(--accent)}
thead th.asc::after{content:" ↑";color:var(--accent)}thead th.desc::after{content:" ↓";color:var(--accent)}
tbody tr{border-bottom:1px solid var(--border);transition:.1s}tbody tr:last-child{border-bottom:none}tbody tr:hover{background:var(--surface2)}
tbody td{padding:12px 14px;font-size:.85rem;text-align:right;vertical-align:middle}tbody td:first-child{text-align:left}
.sname{font-weight:600;font-size:.9rem}.ssym{font-size:.72rem;color:var(--muted);font-family:monospace;margin-top:2px}
.price{font-family:monospace;font-weight:700;font-size:.92rem}.ctag{font-size:.65rem;color:var(--muted);margin-left:2px}
.chg{font-family:monospace;font-size:.82rem;font-weight:600}.chg.up{color:var(--up)}.chg.dn{color:var(--down)}.chg.fl{color:var(--muted)}
.sig{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
.sig.BUY{background:var(--up-bg);color:var(--up);border:1px solid #A8DCC0}
.sig.HOLD{background:var(--accent-bg);color:var(--accent);border:1px solid #BFCFEE}
.sig.SELL{background:var(--down-bg);color:var(--down);border:1px solid #f5c6c3}
.sig.WATCH{background:#FFF8E6;color:#B7791F;border:1px solid #F6D860}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.rsn{font-size:.7rem;color:var(--muted);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.lnks{display:flex;gap:6px;margin-top:3px}.lnk{font-size:.7rem;color:var(--accent);text-decoration:none}.lnk:hover{text-decoration:underline}
.empty{text-align:center;padding:60px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.empty .ico{font-size:2.5rem;margin-bottom:12px}.empty p{color:var(--muted);font-size:.85rem;line-height:1.8}
.empty code{background:#f5f5f5;padding:6px 14px;border-radius:6px;display:inline-block;font-family:monospace;margin-top:6px}
.footer{margin-top:20px;font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}.hsm{display:none}}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div><h1>📈 Stock Dashboard</h1><div class="sub">Dean's personal market tracker</div></div>
  <div id="fetchTime" style="font-size:.75rem;color:var(--muted);padding-top:4px"></div>
</div>
<div class="info">
  💡 <strong>更新數據：</strong>在 Terminal 執行
  <code>cd ~/Downloads/stock-dashboard && python3 fetch.py</code>
  然後重新整理此頁面。或執行 <code>./run.sh</code> 一鍵完成。
</div>
<div class="status"><div class="dot" id="dot"></div><span id="stxt">載入中...</span></div>
<div class="tabs">
  <button class="tab active" data-m="TW" onclick="switchTab('TW')">🇹🇼 台灣 <span class="badge" id="b-TW">0</span></button>
  <button class="tab" data-m="US" onclick="switchTab('US')">🇺🇸 美國 <span class="badge" id="b-US">0</span></button>
</div>
<div class="summary">
  <div class="card"><div class="lbl">追蹤股票</div><div class="val" id="s-count">—</div></div>
  <div class="card"><div class="lbl">今日上漲</div><div class="val up" id="s-up">—</div></div>
  <div class="card"><div class="lbl">今日下跌</div><div class="val dn" id="s-dn">—</div></div>
</div>
<div id="tbl"></div>
<div class="footer">
  <span>資料來源：Yahoo Finance (yfinance) · 訊號僅供參考，非投資建議</span>
  <span id="ftime"></span>
</div>
</div>
<script>
const WL=[
  {s:'2330.TW',n:'台積電',m:'TW'},{s:'2317.TW',n:'鴻海',m:'TW'},
  {s:'2454.TW',n:'聯發科',m:'TW'},{s:'2886.TW',n:'兆豐金',m:'TW'},
  {s:'0050.TW',n:'元大台灣50',m:'TW'},{s:'0056.TW',n:'元大高股息',m:'TW'},
  {s:'AAPL',n:'Apple',m:'US'},{s:'NVDA',n:'NVIDIA',m:'US'},
  {s:'TSLA',n:'Tesla',m:'US'},{s:'TSM',n:'TSMC ADR',m:'US'},
];
let D={},tab='TW',sk='changePct',sd=-1;

async function load(){
  try{
    const r=await fetch('data.json?t='+Date.now());
    if(!r.ok)throw new Error();
    const j=await r.json();
    D=j.data||{};
    const t=new Date(j.fetchedAt);
    document.getElementById('fetchTime').textContent='數據時間：'+t.toLocaleString('zh-TW');
    document.getElementById('ftime').textContent='抓取於：'+t.toLocaleString('zh-TW');
    const age=(Date.now()-t.getTime())/3600000;
    setS(age>24?'warn':'live', age>24?`數據已 ${Math.round(age)} 小時未更新，請執行 python3 fetch.py`:`已載入 ${Object.keys(D).length} 支股票`);
    render();
  }catch(e){
    setS('error','找不到 data.json，請先執行：python3 fetch.py');
    document.getElementById('tbl').innerHTML=`<div class="empty"><div class="ico">⚙️</div><p>尚未抓取數據<br>請在 Terminal 執行：<br><code>cd ~/Downloads/stock-dashboard && python3 fetch.py</code><br>完成後重新整理此頁面</p></div>`;
  }
}
function setS(c,t){document.getElementById('dot').className='dot '+c;document.getElementById('stxt').textContent=t}
function switchTab(m){tab=m;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelector('.tab[data-m='+m+']').classList.add('active');render()}
function sig(d){
  if(!d||d.price==null)return{s:'WATCH',r:'等待數據'};
  let sc=0;const{changePct:c=0,weekChange:w=0,monthChange:mo=0,price:p,week52High:h,week52Low:l}=d;
  if(c>2)sc+=2;else if(c>0)sc+=1;else if(c<-2)sc-=2;else if(c<0)sc-=1;
  if(w>5)sc+=2;else if(w>1)sc+=1;else if(w<-5)sc-=2;else if(w<-1)sc-=1;
  if(mo>10)sc+=2;else if(mo>3)sc+=1;else if(mo<-10)sc-=2;else if(mo<-3)sc-=1;
  if(p&&h&&l){const pos=(p-l)/(h-l||1);if(pos<.25)sc+=1;if(pos>.9)sc-=1}
  if(sc>=3)return{s:'BUY',r:`強勢 · 日漲 ${c>0?'+':''}${c}%`};
  if(sc>=1)return{s:'BUY',r:'偏多 · 短期動能正向'};
  if(sc===0)return{s:'HOLD',r:'中性 · 觀察趨勢'};
  if(sc>=-2)return{s:'HOLD',r:'偏弱 · 等待訊號'};
  return{s:'SELL',r:`下跌趨勢 · 月跌 ${Math.abs(mo)}%`};
}
function spark(cv,hist,up){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const pr=hist.map(h=>h.close).filter(Boolean);
  if(pr.length<2){ctx.fillStyle='#DDE1E9';ctx.fillRect(0,H/2-1,W,2);return}
  const mn=Math.min(...pr),mx=Math.max(...pr),rng=mx-mn||1;
  const pts=pr.map((v,i)=>({x:i*(W/(pr.length-1)),y:H-((v-mn)/rng)*(H-4)-2}));
  const col=up?'#1A8A4A':'#C0392B';
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,col+'33');g.addColorStop(1,col+'00');
  ctx.beginPath();ctx.moveTo(pts[0].x,H);pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke();
}
const f=(n,d=2)=>n==null?'—':n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fp=n=>n==null?'—':(n>=0?'+':'')+n.toFixed(2)+'%';
const cc=n=>!n&&n!==0?'fl':n>0?'up':n<0?'dn':'fl';
function lnks(s){const e=encodeURIComponent(s);return`<div class="lnks"><a class="lnk" href="https://finance.yahoo.com/quote/${e}/" target="_blank">Yahoo ↗</a><a class="lnk" href="https://www.tradingview.com/symbols/${s.replace('.TW','')}/" target="_blank">Chart ↗</a></div>`}
function setSort(k){sd=sk===k?sd*-1:-1;sk=k;render()}
function sorted(arr){return[...arr].sort((a,b)=>{const da=D[a.s]||{},db=D[b.s]||{};const va=da[sk]??(-Infinity*sd),vb=db[sk]??(-Infinity*sd);return(va-vb)*sd})}
function th(k,l,c=''){return`<th class="${c}${sk===k?(sd===1?' asc':' desc'):''}" onclick="setSort('${k}')">${l}</th>`}
function render(){
  const ts=WL.filter(s=>s.m===tab);
  document.getElementById('b-TW').textContent=WL.filter(s=>s.m==='TW').length;
  document.getElementById('b-US').textContent=WL.filter(s=>s.m==='US').length;
  const td=ts.map(s=>D[s.s]).filter(Boolean);
  document.getElementById('s-count').textContent=ts.length;
  document.getElementById('s-up').textContent=td.filter(d=>d.changePct>0).length;
  document.getElementById('s-dn').textContent=td.filter(d=>d.changePct<0).length;
  let h=`<div class="tbl-wrap"><table><thead><tr><th style="text-align:left">股票</th>${th('price','價格')}${th('changePct','當日 %')}${th('weekChange','1週 %','hsm')}${th('monthChange','1月 %','hsm')}<th class="hsm">走勢</th><th>訊號</th></tr></thead><tbody>`;
  for(const s of sorted(ts)){
    const d=D[s.s];const{s:sg,r:rs}=sig(d);const dec=s.s.endsWith('.TW')?1:2;const rid=s.s.replace(/[^a-zA-Z0-9]/g,'_');
    h+=`<tr>
      <td><div class="sname">${s.n}</div><div class="ssym">${s.s}</div></td>
      <td>${d?`<span class="price">${f(d.price,dec)}</span><span class="ctag">${d.currency}</span>`:'—'}</td>
      <td><span class="chg ${cc(d?.changePct)}">${d?fp(d.changePct):'—'}</span></td>
      <td class="hsm"><span class="chg ${cc(d?.weekChange)}">${d?.weekChange!=null?fp(d.weekChange):'—'}</span></td>
      <td class="hsm"><span class="chg ${cc(d?.monthChange)}">${d?.monthChange!=null?fp(d.monthChange):'—'}</span></td>
      <td class="hsm"><canvas id="sp_${rid}" width="80" height="28"></canvas></td>
      <td><span class="sig ${sg}"><span class="sdot"></span>${sg}</span><span class="rsn" title="${rs}">${rs}</span>${lnks(s.s)}</td>
    </tr>`;
  }
  h+=`</tbody></table></div>`;
  document.getElementById('tbl').innerHTML=h;
  requestAnimationFrame(()=>{
    for(const s of sorted(ts)){const d=D[s.s];if(!d?.history?.length)continue;const cv=document.getElementById('sp_'+s.s.replace(/[^a-zA-Z0-9]/g,'_'));if(cv)spark(cv,d.history,(d.monthChange||0)>=0)}
  });
}
load();
</script>
</body>
</html>
